# Fork-local Apple Silicon release: signed and notarized aarch64-apple-darwin
# DMG containing only the herdr terminal CLI.
#
# Separate from the canonical multi-platform `release.yml` so this path does
# not own or replace official release semantics.
#
# Based on wangyuling93/codex `.github/workflows/rust-release-macos-arm64-signed.yml`.
#
# The build job stays unprivileged; signing values are only exposed to the
# protected `codesigning` GitHub environment job:
#   secrets: APPLE_DEVELOPER_ID_P12, APPLE_DEVELOPER_ID_P12_PASSWORD,
#            APPLE_APP_SPECIFIC_PASSWORD
#   variables: APPLE_ID, APPLE_TEAM_ID
#
# Local setup (once per repo / when certs rotate), on macOS with `gh` auth:
#   .github/scripts/setup-macos-signing-secrets.sh --p12 /path/to/DeveloperID.p12
# That creates the `codesigning` environment and uploads the secrets/variables
# above. Pass --repo OWNER/REPO if the checkout remote is not the target fork.
#
# Output:
#   herdr-aarch64-apple-darwin.dmg
#
# Triggers:
#   - push to master (replaces automatic ci.yml on this fork)
#   - manual: Actions → Release macOS arm64 signed DMG → Run workflow
#
# Default on push / manual: upload Actions artifacts only (no GitHub Release).
# Manual runs can enable "Publish GitHub Release" for a prerelease tag:
#   macos-arm64-v{version}-{7-char commit sha}
# Short SHA ties the tag to the built commit: same version + same commit →
# same tag. Re-runs replace assets on that release (overwrite_files: true).

name: Release macOS arm64 signed DMG

on:
  push:
    branches: [master]
    paths-ignore:
      - "website/**"
      - ".github/APPROVED_CONTRIBUTORS"
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: Create a GitHub prerelease (and tag) from the built assets
        required: false
        type: boolean
        default: false
      release_version:
        description: >-
          Version embedded in the binary and release metadata. Leave empty to
          use Cargo.toml package version (for example, 0.7.5).
        required: false
        type: string
        default: ""
      tag:
        description: >-
          Optional release tag (macos-arm64-vX.Y.Z[-shortsha]). Its version is
          used when release_version is empty. Otherwise the two must match
          (optional -abcdef0 commit suffix is ignored for the version check).
        required: false
        type: string
        default: ""

# Default token is read-only; the publish job elevates to write.
permissions:
  contents: read

# One signed build per ref; do not cancel in-flight notarization.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1
  ZIG_VERSION: "0.16.0"
  TARGET: aarch64-apple-darwin
  BINARIES: herdr
  DMG_NAME: herdr-aarch64-apple-darwin.dmg

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_name: ${{ steps.resolve.outputs.release_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Resolve release version and tag
        id: resolve
        shell: bash
        env:
          # github.event.inputs is empty on push; inputs.* is dispatch-only.
          INPUT_RELEASE_VERSION: ${{ github.event.inputs.release_version || '' }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
          TAG_PREFIX: macos-arm64-v
        run: |
          set -euo pipefail

          source_version="$(
            python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path("Cargo.toml").read_text(encoding="utf-8")
          # Package-level version (herdr is not a workspace).
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', text)
          if match is None:
              sys.exit("could not find package version in Cargo.toml")
          print(match.group(1))
          PY
          )"

          version_re='[0-9]+\.[0-9]+\.[0-9]+(-(alpha(\.[0-9]+){0,2}|beta(\.[0-9]+)?))?'
          short_sha_re='[0-9a-f]{7}'

          strip_optional_short_sha() {
            local body="$1"
            if [[ "${body}" =~ ^(.*)-${short_sha_re}$ ]]; then
              printf '%s\n' "${BASH_REMATCH[1]}"
            else
              printf '%s\n' "${body}"
            fi
          }

          if [[ -n "${INPUT_RELEASE_VERSION}" ]]; then
            release_version="${INPUT_RELEASE_VERSION}"
            version_source="workflow input"
          elif [[ -n "${INPUT_TAG}" ]]; then
            [[ "${INPUT_TAG}" == "${TAG_PREFIX}"* ]] \
              || { echo "Tag '${INPUT_TAG}' must start with ${TAG_PREFIX}" >&2; exit 1; }
            release_version="$(strip_optional_short_sha "${INPUT_TAG#"${TAG_PREFIX}"}")"
            version_source="workflow tag input"
          else
            release_version="${source_version}"
            version_source="Cargo.toml"
          fi

          [[ "${release_version}" =~ ^${version_re}$ ]] \
            || { echo "Release version '${release_version}' is unsupported" >&2; exit 1; }
          [[ "${release_version}" != "0.0.0" ]] \
            || { echo "Refusing to publish or embed the development placeholder 0.0.0" >&2; exit 1; }

          if [[ -n "${INPUT_TAG}" ]]; then
            release_tag="${INPUT_TAG}"
          else
            short_sha="${GITHUB_SHA:0:7}"
            if [[ ! "${short_sha}" =~ ^${short_sha_re}$ ]]; then
              echo "Could not derive a 7-character commit sha from GITHUB_SHA='${GITHUB_SHA}'" >&2
              exit 1
            fi
            release_tag="${TAG_PREFIX}${release_version}-${short_sha}"
          fi

          pattern="^${TAG_PREFIX}${version_re}(-${short_sha_re})?$"
          [[ "${release_tag}" =~ ${pattern} ]] \
            || { echo "Tag '${release_tag}' must match ${TAG_PREFIX}X.Y.Z[...][-shortsha]" >&2; exit 1; }

          tag_ver="$(strip_optional_short_sha "${release_tag#"${TAG_PREFIX}"}")"
          [[ "${tag_ver}" == "${release_version}" ]] \
            || { echo "Tag version ${tag_ver} ≠ release version ${release_version}" >&2; exit 1; }

          tag_body="${release_tag#"${TAG_PREFIX}"}"
          if [[ "${tag_body}" == "${release_version}" ]]; then
            release_name="${release_version} (macos-arm64)"
          else
            uniqueness="${tag_body#"${release_version}-"}"
            release_name="${release_version} (macos-arm64 ${uniqueness})"
          fi

          {
            echo "release_tag=${release_tag}"
            echo "release_version=${release_version}"
            echo "release_name=${release_name}"
          } >> "${GITHUB_OUTPUT}"

          echo "herdr ${release_version} from ${version_source}; release tag ${release_tag}"

  build:
    needs: resolve-version
    name: Build arm64 binary
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: "true"
      TARGET: aarch64-apple-darwin
      BINARIES: herdr

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set package version when overridden
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
        run: |
          set -euo pipefail
          python3 - "$RELEASE_VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          cargo_toml = Path("Cargo.toml")
          text = cargo_toml.read_text(encoding="utf-8")
          match = re.search(r'(?m)^(version\s*=\s*")([^"]+)("\s*)$', text)
          if match is None:
              raise SystemExit("could not find package version in Cargo.toml")
          old_version = match.group(2)
          if old_version == version:
              print(f"Cargo.toml version already {version}")
              raise SystemExit(0)
          cargo_toml.write_text(
              text[: match.start(2)] + version + text[match.end(2) :],
              encoding="utf-8",
          )
          print(f"Set package version from {old_version} to {version}")
          PY

      - name: Verify macOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          uname -m
          # Prefer native arm64 runners for aarch64-apple-darwin.
          arch="$(uname -m)"
          [[ "${arch}" == "arm64" ]] \
            || { echo "Expected arm64 runner, got ${arch}" >&2; exit 1; }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-apple-darwin

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install macOS build tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-macos-arm64-signed-${{ env.TARGET }}

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Cargo build (release)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${TARGET}"

      - name: Verify embedded herdr version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/herdr"
          version_output="$("${binary}" --version)"
          echo "${version_output}"
          [[ "${version_output}" == *"${RELEASE_VERSION}"* ]] \
            || { echo "Expected herdr --version to contain ${RELEASE_VERSION}" >&2; exit 1; }
          lipo "${binary}" -verify_arch arm64
          file "${binary}"

      - name: Strip release binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/herdr"
          strip -S -x "${binary}"

      - name: Upload unsigned binary for signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-arm64-unsigned-binaries
          path: target/aarch64-apple-darwin/release/herdr
          if-no-files-found: error
          retention-days: 1

  sign-and-package:
    needs: build
    name: Sign, notarize, and staple arm64 DMG
    runs-on: macos-latest
    timeout-minutes: 180
    environment:
      name: codesigning
    permissions:
      contents: read
    env:
      BINARIES: herdr
      STAGE_DIR: dist/release-assets
      TARGET: aarch64-apple-darwin
      DMG_NAME: herdr-aarch64-apple-darwin.dmg

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download unsigned binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-arm64-unsigned-binaries
          path: target/aarch64-apple-darwin/release

      - name: Import Developer ID certificate and notarization credentials
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing codesigning secret APPLE_APP_SPECIFIC_PASSWORD}"
          : "${APPLE_DEVELOPER_ID_P12:?Missing codesigning secret APPLE_DEVELOPER_ID_P12}"
          : "${APPLE_DEVELOPER_ID_P12_PASSWORD:?Missing codesigning secret APPLE_DEVELOPER_ID_P12_PASSWORD}"
          : "${APPLE_ID:?Missing codesigning variable APPLE_ID}"
          : "${APPLE_TEAM_ID:?Missing codesigning variable APPLE_TEAM_ID}"

          certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          keychain_path="${RUNNER_TEMP}/herdr-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          notary_profile="herdr-notary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "::add-mask::${keychain_password}"

          printf '%s' "$APPLE_DEVELOPER_ID_P12" | base64 --decode >"$certificate_path"
          chmod 0600 "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$({
            security find-identity -v -p codesigning "$keychain_path" || true
          } | awk '/Developer ID Application:/ { print $2; exit }')"
          if [[ -z "$signing_identity" ]]; then
            echo "No Developer ID Application identity was imported" >&2
            security find-identity -v -p codesigning "$keychain_path" || true
            exit 1
          fi

          xcrun notarytool store-credentials "$notary_profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$keychain_path" \
            --validate

          {
            echo "NOTARY_PROFILE=${notary_profile}"
            echo "SIGNING_IDENTITY=${signing_identity}"
            echo "SIGNING_KEYCHAIN_PATH=${keychain_path}"
          } >> "$GITHUB_ENV"

      - name: Sign and verify binary
        shell: bash
        run: |
          set -euo pipefail

          for binary in ${BINARIES}; do
            binary_path="target/${TARGET}/release/${binary}"
            entitlements="${GITHUB_WORKSPACE}/.github/scripts/macos-signing/${binary}.entitlements.plist"
            chmod 0755 "$binary_path"

            "${GITHUB_WORKSPACE}/.github/scripts/macos-signing/sign_macos_code.sh" \
              --target "$binary_path" \
              --identity "$SIGNING_IDENTITY" \
              --deep false \
              --identifier "$binary" \
              --options runtime \
              --timestamp true \
              --entitlements "$entitlements"

            lipo "$binary_path" -verify_arch arm64
            codesign --verify --strict --verbose=2 "$binary_path"

            actual_entitlements="$(mktemp)"
            normalized_actual="$(mktemp)"
            normalized_expected="$(mktemp)"
            codesign -d --entitlements :- "$binary_path" >"$actual_entitlements"
            plutil -convert xml1 -o "$normalized_actual" "$actual_entitlements"
            plutil -convert xml1 -o "$normalized_expected" "$entitlements"
            diff -u "$normalized_expected" "$normalized_actual"
            rm -f "$actual_entitlements" "$normalized_actual" "$normalized_expected"
          done

      - name: Build DMG
        shell: bash
        run: |
          set -euo pipefail

          release_dir="target/${TARGET}/release"
          dmg_root="${RUNNER_TEMP}/herdr-dmg-root"
          dmg_path="${release_dir}/${DMG_NAME}"
          rm -rf "$dmg_root"
          mkdir -p "$dmg_root"
          for binary in ${BINARIES}; do
            ditto "${release_dir}/${binary}" "${dmg_root}/${binary}"
          done

          rm -f "$dmg_path"
          hdiutil create \
            -volname "herdr (${TARGET})" \
            -srcfolder "$dmg_root" \
            -format UDZO \
            -ov \
            "$dmg_path"

      - name: Sign, notarize, and staple DMG
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="target/${TARGET}/release/${DMG_NAME}"
          report_dir="${GITHUB_WORKSPACE}/macos-notarization/${TARGET}"
          report_path="${report_dir}/dmg-notarytool-submit.json"
          mkdir -p "$report_dir"

          "${GITHUB_WORKSPACE}/.github/scripts/macos-signing/sign_macos_code.sh" \
            --target "$dmg_path" \
            --identity "$SIGNING_IDENTITY" \
            --deep false \
            --timestamp true

          codesign --verify --strict --verbose=2 "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$SIGNING_KEYCHAIN_PATH" \
            --wait \
            --timeout 45m \
            --output-format json \
            | tee "$report_path"

          python3 - "$report_path" <<'PY'
          import json
          import sys

          report_path = sys.argv[1]
          with open(report_path, encoding="utf-8") as report_file:
              report = json.load(report_file)
          if report.get("status") != "Accepted":
              raise SystemExit(f"Notarization was not accepted: {report}")
          PY

          xcrun stapler staple -v "$dmg_path"
          xcrun stapler validate -v "$dmg_path"
          shasum -a 256 "$dmg_path" >"${report_dir}/dmg-sha256.txt"

      - name: Verify and stage signed DMG
        shell: bash
        run: |
          set -euo pipefail

          release_dir="target/${TARGET}/release"
          dmg_path="${release_dir}/${DMG_NAME}"
          mount_dir="${RUNNER_TEMP}/herdr-dmg-mount"
          stage="${STAGE_DIR}"

          hdiutil verify "$dmg_path"
          codesign --verify --strict --verbose=2 "$dmg_path"
          xcrun stapler validate -v "$dmg_path"

          rm -rf "$mount_dir"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          cleanup_mount() {
            diskutil eject "$mount_dir" >/dev/null
          }
          trap cleanup_mount EXIT
          for binary in ${BINARIES}; do
            lipo "${mount_dir}/${binary}" -verify_arch arm64
            codesign --verify --strict --verbose=2 "${mount_dir}/${binary}"
          done
          cleanup_mount
          trap - EXIT

          rm -rf "$stage"
          mkdir -p "$stage"
          cp "$dmg_path" "${stage}/${DMG_NAME}"
          ls -lah "$stage"

      - name: Upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-arm64-signed
          path: dist/release-assets/herdr-aarch64-apple-darwin.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload notarization report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-arm64-notarization
          path: macos-notarization/aarch64-apple-darwin/
          if-no-files-found: warn
          retention-days: 14

      - name: Delete temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
          rm -f "${RUNNER_TEMP}/developer-id-application.p12"

  publish:
    # Push builds always stop at signed artifacts; only manual dispatch can publish.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_github_release == 'true' }}
    needs:
      - resolve-version
      - sign-and-package
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-arm64-signed
          path: release-assets

      - name: Verify DMG present
        shell: bash
        run: |
          set -euo pipefail
          dmg="release-assets/herdr-aarch64-apple-darwin.dmg"
          if [[ ! -f "$dmg" ]]; then
            echo "${dmg} not found" >&2
            ls -lahR release-assets || true
            exit 1
          fi
          ls -lah release-assets/

      - name: Release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          notes_path="${RUNNER_TEMP}/release-notes.md"
          {
            echo "Signed, notarized, and stapled Apple Silicon (aarch64-apple-darwin) build."
            echo
            echo "Primary asset: \`herdr-aarch64-apple-darwin.dmg\`"
            echo
            echo "Contents: \`herdr\`."
            echo
            echo "Built from \`${GITHUB_SHA}\`."
            echo
            git log -1 --format=%B "${GITHUB_SHA}^{commit}"
          } > "${notes_path}"
          echo "path=${notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ needs.resolve-version.outputs.release_name }}
          tag_name: ${{ needs.resolve-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.path }}
          files: release-assets/herdr-aarch64-apple-darwin.dmg
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
          prerelease: true
